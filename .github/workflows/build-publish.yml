name: Build & Publish Decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Build all decks (ESM)
        run: node scripts/build-decks.mjs

      - name: Build docs (VitePress)
        run: |
          cd docs
          npm ci || npm install
          npm run docs:build

      - name: Merge deck builds + docs into single site
        run: |
          mkdir -p _site
          # Deck ESM modules at root (registry.json + TurboX/index.mjs)
          cp -r dist/* _site/
          # VitePress docs under /docs/
          if [ -d docs/.vitepress/dist ]; then
            cp -r docs/.vitepress/dist _site/docs/
          fi
          echo "=== Site contents ==="
          find _site -name "*.mjs" -o -name "*.json" | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
