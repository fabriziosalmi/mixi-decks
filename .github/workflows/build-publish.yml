name: Build & Publish Decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Build all decks (ESM)
        run: node scripts/build-decks.mjs

      - name: Build docs (VitePress)
        run: |
          cd docs
          npm ci || npm install
          npm run docs:build

      - name: Merge deck builds + docs into single site
        run: |
          mkdir -p _site
          # Deck ESM modules at root (registry.json + TurboX/index.mjs)
          cp -r dist/* _site/
          # VitePress docs under /docs/
          if [ -d docs/.vitepress/dist ]; then
            cp -r docs/.vitepress/dist _site/docs/
          fi
          # The root of the artifact holds ESM modules, not pages, so
          # /mixi-decks/ answered 404 to anyone who opened it. Send them to the
          # docs instead of leaving a dead URL. Written here rather than
          # committed because dist/ is rebuilt on every run.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Mixi Decks</title>
          <link rel="canonical" href="https://fabriziosalmi.github.io/mixi-decks/docs/">
          <meta http-equiv="refresh" content="0; url=docs/">
          </head>
          <body>
          <p>Mixi Decks documentation is at <a href="docs/">/mixi-decks/docs/</a>.</p>
          </body>
          </html>
          HTML
          echo "=== Site contents ==="
          find _site -name "*.mjs" -o -name "*.json" | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
