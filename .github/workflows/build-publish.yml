name: Build & Publish Decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build all decks (ESM)
        run: node scripts/build-decks.mjs

      - name: Verify output
        run: |
          echo "Built decks:"
          ls -la dist/*/index.mjs | awk '{print $5, $NF}'
          echo "---"
          echo "Registry: $(cat dist/registry.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')  decks"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
